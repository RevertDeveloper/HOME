services:
  api:
    container_name: home-tanian-api
    build:
      context: .
      dockerfile: Dockerfile.api
    image: home-tanian-api:stable
    restart: unless-stopped
    environment:
      BACKEND_ALLOWED_ORIGINS: https://carlosrevert.es,http://localhost:10000,http://127.0.0.1:10000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:10001/api/health', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    ports:
      - "10001:10001"
    networks:
      - home_tanian_net

  web:
    container_name: home-tanian-web
    build:
      context: .
      dockerfile: Dockerfile.web
    image: home-tanian-web:stable
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "10000:10000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:10000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - home_tanian_net

networks:
  home_tanian_net:
    driver: bridge
